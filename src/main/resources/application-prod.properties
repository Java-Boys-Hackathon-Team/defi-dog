main.datasource.url=${PG_DATASOURCE_URL}
main.datasource.username=${PG_NAME}
main.datasource.password=${PG_PASS}

jmix.rest.anonymous-url-patterns=\/rest/entities/AccessRequest
jmix.ui.allow-anonymous-access=true

# Приложение стоит за обратным прокси, который терминирует TLS: без этого
# редиректы уводят с https на http.
server.forward-headers-strategy=framework

# Демон Docker, в котором запускаются статические анализаторы. Сокет хоста
# проброшен в контейнер продовым compose-файлом.
docker.host=unix:///var/run/docker.sock

# На проде ключи внешних сервисов - заглушки, поэтому фоновые обращения к ним
# выключены: иначе журнал забивается отказами авторизации каждые несколько минут.
# С настоящими ключами обе строки убираются.
telegram.bot.enabled=false
coinmarketcap.updater.enabled=false
